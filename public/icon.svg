<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#08090D" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container: Rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle tech crosshair lines -->
  <line x1="32" y1="4" x2="32" y2="10" stroke="#00E599" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="54" x2="32" y2="60" stroke="#00E599" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round" />
  <line x1="4" y1="32" x2="10" y2="32" stroke="#00E599" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round" />
  <line x1="54" y1="32" x2="60" y2="32" stroke="#00E599" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round" />

  <!-- Pulse telemetry background wave -->
  <path d="M 8 36 L 18 36 L 24 26 L 30 44 L 36 28 L 42 38 L 48 34 L 56 34" stroke="#047857" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Main stylized CashPulse symbol: Angular BCH 'C' + Telemetry Lightning Bolt -->
  <g filter="url(#glow)">
    <!-- Lightning core angled at 15deg (BCH signature tilt) -->
    <path d="M 36 12 L 20 34 L 31 34 L 26 52 L 46 28 L 34 28 Z" fill="url(#neonPulse)" />
    <!-- Secondary sharp orbital arc -->
    <path d="M 18 20 C 13 25 13 38 18 44" stroke="#00E599" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <path d="M 46 18 C 50 22 51 30 49 36" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  </g>

  <!-- Instant zero-conf ping dot -->
  <circle cx="48" cy="18" r="2.5" fill="#FFFFFF" />
  <circle cx="48" cy="18" r="4.5" stroke="#00E599" stroke-width="1" stroke-opacity="0.7" />
</svg>
